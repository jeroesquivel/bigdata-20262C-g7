# Configuración de ejemplo — copiar a config/config.yaml (ignorado por git) y ajustar.
# Los secretos NO van en este archivo: se leen de variables de entorno o de Colab Secrets.

lake:
  # Rutas relativas a notebooks/ o src/. En Colab se procesa sobre el disco local (/content/cpa/datalake)
  # y al terminar se copia a Drive (drive_backup); no escribir directo sobre el montaje de Drive (D22).
  root: ../datalake
  drive_backup: /content/drive/MyDrive/cpa/datalake   # solo Colab
  landing: ../datalake/landing           # solo lectura
  bronze: ../datalake/bronze
  silver: ../datalake/silver
  gold: ../datalake/gold
  quarantine: ../datalake/quarantine
  checkpoints: ../datalake/_checkpoints
  run_log: ../datalake/_meta/run_log

spark:
  master: local[*]
  session_timezone: UTC
  shuffle_partitions: 8
  partition_overwrite_mode: dynamic # spark.sql.sources.partitionOverwriteMode (D7)

streaming:
  max_files_per_trigger: 10
  dedupe_watermark: 1 hour           # sobre ingest_ts, clave dedupe_key (DECISIONS.md D5)

analytics:
  as_of_date: 2025-08-31             # fecha de referencia para "últimos N días"
  cost_negative_tolerance: -0.01     # regla R5
  future_event_tolerance: 5 minutes  # regla R3: timestamp <= ingest_ts + tolerancia (D21)
  anomaly_mad_threshold: 3.5         # D11

serving:
  keyspace: cpa
  # Variables de entorno requeridas (no versionar sus valores):
  #   ASTRA_DB_TOKEN          token de aplicación de AstraDB ("AstraCS:...")
  #   ASTRA_DB_BUNDLE_PATH    ruta al secure-connect-<db>.zip
