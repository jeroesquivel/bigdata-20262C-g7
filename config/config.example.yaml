# Configuración de ejemplo. Para cambiar algo, copiarla a config/config.yaml (ignorado por git) y editar esa copia;
# si config/config.yaml no existe, el pipeline usa este archivo tal cual.
# Los secretos NO van acá: se leen de variables de entorno o de Colab Secrets (ver "serving").

lake:
  # Raíz del lago. Si es relativa, se resuelve contra la raíz del repo (no contra notebooks/),
  # así funciona igual desde un notebook, un script o pytest. Se puede pisar con la variable CPA_LAKE_ROOT
  # (por ejemplo, para correr el lote de prueba de tests/fixtures/ en otro lago).
  root: datalake
  # Zonas, relativas a la raíz del lago (o rutas absolutas).
  landing: landing                  # solo lectura: ningún proceso escribe acá
  bronze: bronze
  silver: silver
  gold: gold
  quarantine: quarantine
  checkpoints: _checkpoints
  meta: _meta                       # run_log de cada corrida

# Carpeta de evidencia de la entrega, relativa a la raíz del repo. Se puede pisar con CPA_EVIDENCE_DIR
# (por ejemplo, para que las corridas de prueba no llenen el repo).
evidence_dir: evidence/entrega2

spark:
  master: local[*]
  app_name: cpa-pipeline
  session_timezone: UTC
  shuffle_partitions: 8             # dataset chico: evita 200 tareas vacías por shuffle
  partition_overwrite_mode: dynamic # reemplaza solo las particiones que se escriben (D7)

streaming:
  max_files_per_trigger: 10         # 120 archivos -> 12 micro-lotes (D4)
  dedupe_watermark: 1 hour          # sobre ingest_ts, clave dedupe_key (D5)

analytics:
  as_of_date: 2025-08-31            # fecha de referencia para "últimos N días"
  cost_negative_tolerance: -0.01    # regla R5
  future_event_tolerance: 5 minutes # regla R3: timestamp <= ingest_ts + tolerancia (D21)
  anomaly_mad_threshold: 3.5        # D11

serving:
  keyspace: cpa
  connector_package: com.datastax.spark:spark-cassandra-connector_2.12:3.5.1   # D9
  # Variables de entorno requeridas (no versionar sus valores):
  #   ASTRA_DB_TOKEN          token de aplicación de AstraDB ("AstraCS:...")
  #   ASTRA_DB_BUNDLE_PATH    ruta al secure-connect-<db>.zip
